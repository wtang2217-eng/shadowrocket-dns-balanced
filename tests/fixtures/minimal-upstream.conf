# test fixture
[General]
# existing settings must be retained unless managed
ipv6 = true
bypass-system = true
skip-proxy = 192.168.0.0/16, localhost, *.local, *.lan
dns-server = system
fallback-dns-server = system

[Host]
dns-server = 192.0.2.53
fixture.example = 192.0.2.1

[Rule]
DOMAIN-SUFFIX,ads.example,Reject
DOMAIN,exact.example,REJECT
DOMAIN-SUFFIX,parent.example,REJECT-DROP
DOMAIN-SUFFIX,cn,DIRECT
GEOIP,CN,DIRECT
FINAL,PROXY

[URL Rewrite]
^https?://example\.cn https://example.com 302
